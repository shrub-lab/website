<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>只读工作流阅读器｜天津0710项目</title>
  <style>
    *{box-sizing:border-box} :root{--ink:#172033;--muted:#687386;--line:#dbe2ea;--blue:#2878ff;--panel:#fff;--bg:#f5f7fa}
    body{margin:0;color:var(--ink);font-family:Inter,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);overflow:hidden}
    button{font:inherit}.app{height:100vh;display:grid;grid-template-rows:72px 1fr}.topbar{display:flex;align-items:center;gap:18px;padding:0 24px;background:#fff;border-bottom:1px solid #e7ebf0;z-index:10}
    .brand{font-size:17px;font-weight:750;letter-spacing:-.02em}.badge{padding:6px 10px;border-radius:99px;background:#eaf2ff;color:#1765db;font-size:12px;font-weight:650}.project{font-size:13px;color:var(--muted);margin-right:auto}.actions{display:flex;gap:8px}.btn{border:1px solid #d9e0e8;background:#fff;border-radius:10px;padding:9px 13px;color:#354052;cursor:pointer}.btn:hover{background:#f4f7fb}.btn.primary{background:#172033;color:#fff;border-color:#172033}
    .workspace{position:relative;overflow:hidden}.canvas{position:absolute;inset:0;cursor:grab;background-color:#fafbfd;background-image:radial-gradient(#cbd3df 1px,transparent 1px);background-size:20px 20px}.canvas.dragging{cursor:grabbing}.world{position:absolute;width:1780px;height:720px;transform-origin:0 0}
    svg{position:absolute;inset:0;width:1780px;height:720px;overflow:visible;pointer-events:auto}.edge-group{pointer-events:none}.edge{fill:none;stroke:#8fa0b8;stroke-width:2}.edge-hit{fill:none;stroke:transparent;stroke-width:22;pointer-events:stroke}.edge-label{font-size:12px;fill:#5d6c80}.edge-chip{fill:white;stroke:#dce3ec}.edge-chip,.edge-label{opacity:0;transition:opacity .18s ease}.edge-group:hover .edge-chip,.edge-group:hover .edge-label{opacity:1}
    .node{position:absolute;width:330px;border:1px solid #dce3ec;border-radius:18px;background:#fff;box-shadow:0 14px 35px rgba(32,49,75,.10);overflow:hidden;user-select:none;cursor:move}.node.selected{outline:3px solid rgba(40,120,255,.22);border-color:#2878ff}.node-head{display:flex;align-items:center;gap:10px;padding:15px 16px 11px}.step{display:grid;place-items:center;width:25px;height:25px;border-radius:50%;background:#172033;color:#fff;font-size:12px;font-weight:700}.type{margin-left:auto;text-transform:uppercase;color:#8290a3;font-size:10px;font-weight:750;letter-spacing:.12em}.node h3{font-size:16px;margin:0;padding:0 16px 7px}.node p{font-size:12px;line-height:1.55;color:#697588;margin:0;padding:0 16px 15px}.thumb{width:calc(100% - 20px);height:178px;margin:0 10px 10px;border-radius:12px;object-fit:cover;background:#eef2f7;display:block}.prompt-preview{margin:0 10px 10px;padding:13px;border-radius:12px;background:#f4f7fb;color:#566276;font-size:12px;line-height:1.55;height:112px;overflow:hidden;white-space:pre-wrap}.ports:before,.ports:after{content:"";position:absolute;top:50%;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid #70839b}.ports:before{left:-7px}.ports:after{right:-7px}
    .hint{position:absolute;left:20px;bottom:18px;display:flex;gap:12px;padding:10px 13px;border:1px solid #e0e5ec;border-radius:12px;background:rgba(255,255,255,.9);color:#6f7a8b;font-size:12px;backdrop-filter:blur(8px)}
    .drawer{position:absolute;right:0;top:0;bottom:0;width:min(430px,92vw);background:#fff;border-left:1px solid #e1e6ed;box-shadow:-20px 0 45px rgba(30,42,60,.12);z-index:20;transform:translateX(105%);transition:.25s ease;display:flex;flex-direction:column}.drawer.open{transform:none}.drawer-head{display:flex;align-items:flex-start;gap:12px;padding:24px;border-bottom:1px solid #eef1f5}.drawer-head h2{font-size:21px;margin:4px 0}.drawer-head p{margin:0;color:#758093;font-size:12px}.close{margin-left:auto;border:0;background:#f2f4f7;border-radius:50%;width:34px;height:34px;cursor:pointer}.drawer-body{padding:22px 24px;overflow:auto}.drawer-img{width:100%;border-radius:14px;margin-bottom:18px}.label{margin:19px 0 8px;color:#8a95a6;font-weight:750;font-size:10px;letter-spacing:.12em}.prompt-full{white-space:pre-wrap;background:#f5f7fa;border:1px solid #e5e9ef;border-radius:14px;padding:15px;font-size:13px;line-height:1.65;max-height:390px;overflow:auto}.empty{color:#8b95a3}.drawer-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.drawer-actions .btn{font-size:13px}.upload{display:block;text-align:center}.upload input{display:none}.toast{position:absolute;left:50%;bottom:28px;transform:translate(-50%,20px);background:#172033;color:#fff;padding:10px 15px;border-radius:99px;font-size:12px;opacity:0;transition:.2s;z-index:30}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:760px){.topbar{padding:0 12px;gap:8px}.project{display:none}.actions .btn:not(.primary){display:none}.node{width:290px}.hint{display:none}}
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar"><div class="brand">只读工作流阅读器</div><span class="badge">本地测试</span><div class="project" id="projectMeta"></div><div class="actions"><button class="btn" id="fitBtn">适应画布</button><button class="btn" id="resetBtn">恢复布局</button><button class="btn primary" id="copyPathTop">复制整条路径</button></div></header>
    <section class="workspace" id="workspace"><div class="canvas" id="canvas"><div class="world" id="world"><svg id="edges"></svg><div id="nodes"></div></div></div><div class="hint"><span>拖动画布查看</span><span>滚轮缩放</span><span>拖动卡片调整位置</span><span>点击卡片阅读</span></div>
      <aside class="drawer" id="drawer"><div class="drawer-head"><div><p id="drawerStep"></p><h2 id="drawerTitle"></h2><p id="drawerNote"></p></div><button class="close" id="closeBtn">×</button></div><div class="drawer-body"><img class="drawer-img" id="drawerImg" alt="节点素材"><div class="label">提示词 / 节点内容</div><div class="prompt-full" id="drawerPrompt"></div><div class="drawer-actions"><button class="btn primary" id="copyNode">复制本节点</button><button class="btn" id="copyPath">复制到此路径</button><label class="btn upload">替换预览素材<input id="localFile" type="file" accept="image/*"></label><button class="btn" id="closeDetail">返回画布</button></div></div></aside>
      <div class="toast" id="toast"></div>
    </section>
  </main>
  <script src="workflow-data.js"></script>
  <script>
  (()=>{
    const data=window.WORKFLOW_DATA, world=document.querySelector('#world'), canvas=document.querySelector('#canvas'), nodeLayer=document.querySelector('#nodes'), svg=document.querySelector('#edges');
    const drawer=document.querySelector('#drawer'), toast=document.querySelector('#toast'); let selected=null, scale=.8, pan={x:40,y:40}, panning=null, dragging=null;
    const positions=Object.fromEntries(data.nodes.map(n=>[n.id,{...n.position}]));
    document.querySelector('#projectMeta').textContent=`来源：${data.sourceProject.name} · 抽取 4 / ${data.sourceProject.nodeCount} 个节点 · 原文件未修改`;
    function renderNodes(){nodeLayer.innerHTML=''; data.nodes.forEach(n=>{const el=document.createElement('article'); el.className='node ports'+(selected===n.id?' selected':''); el.dataset.id=n.id; el.style.left=positions[n.id].x+'px';el.style.top=positions[n.id].y+'px'; el.innerHTML=`<div class="node-head"><span class="step">${n.step}</span><span class="type">${n.kind==='prompt'?'指令节点':'结果节点'}</span></div><h3>${n.title}</h3>${n.image?`<img class="thumb" src="${n.image}" alt="${n.title}">`:`<div class="prompt-preview">${escape(n.prompt||n.note)}</div>`}<p>${n.note}</p>`; el.addEventListener('pointerdown',startNodeDrag); el.addEventListener('click',e=>{if(!el.dataset.moved) openNode(n.id)}); nodeLayer.append(el)}); drawEdges()}
    function escape(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function drawEdges(){svg.innerHTML='<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8fa0b8"/></marker></defs>'; data.edges.forEach(e=>{const a=positions[e.source],b=positions[e.target],sourceEl=nodeLayer.querySelector(`[data-id="${e.source}"]`),targetEl=nodeLayer.querySelector(`[data-id="${e.target}"]`);const sourceWidth=sourceEl?.offsetWidth||330,sourceHeight=sourceEl?.offsetHeight||300,targetHeight=targetEl?.offsetHeight||300;const x1=a.x+sourceWidth,y1=a.y+sourceHeight/2,x2=b.x,y2=b.y+targetHeight/2,dx=Math.max(54,(x2-x1)*.42),d=`M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}`;const midX=(x1+x2)/2,midY=(y1+y2)/2;svg.insertAdjacentHTML('beforeend',`<g class="edge-group"><path class="edge-hit" d="${d}"/><path class="edge" marker-end="url(#arrow)" d="${d}"/><rect class="edge-chip" x="${midX-45}" y="${midY-14}" width="90" height="26" rx="13"/><text class="edge-label" x="${midX}" y="${midY+4}" text-anchor="middle">${e.label}</text></g>`)})}
    function applyTransform(){world.style.transform=`translate(${pan.x}px,${pan.y}px) scale(${scale})`}
    function startNodeDrag(e){e.stopPropagation(); const el=e.currentTarget,p=positions[el.dataset.id]; dragging={el,id:el.dataset.id,x:e.clientX,y:e.clientY,ox:p.x,oy:p.y};el.setPointerCapture(e.pointerId);el.dataset.moved='';}
    window.addEventListener('pointermove',e=>{if(dragging){const dx=(e.clientX-dragging.x)/scale,dy=(e.clientY-dragging.y)/scale;if(Math.abs(dx)+Math.abs(dy)>4)dragging.el.dataset.moved='1'; positions[dragging.id]={x:dragging.ox+dx,y:dragging.oy+dy};dragging.el.style.left=positions[dragging.id].x+'px';dragging.el.style.top=positions[dragging.id].y+'px';drawEdges()}else if(panning){pan={x:panning.ox+e.clientX-panning.x,y:panning.oy+e.clientY-panning.y};applyTransform()}});
    window.addEventListener('pointerup',()=>{dragging=null;panning=null;canvas.classList.remove('dragging')}); canvas.addEventListener('pointerdown',e=>{if(e.target.closest('.node'))return;panning={x:e.clientX,y:e.clientY,ox:pan.x,oy:pan.y};canvas.classList.add('dragging')});
    canvas.addEventListener('wheel',e=>{e.preventDefault();const old=scale;scale=Math.min(1.35,Math.max(.38,scale*(e.deltaY<0?1.1:.9)));const r=canvas.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;pan.x=mx-(mx-pan.x)*(scale/old);pan.y=my-(my-pan.y)*(scale/old);applyTransform()},{passive:false});
    function openNode(id){selected=id;const n=data.nodes.find(x=>x.id===id);document.querySelector('#drawerStep').textContent=`步骤 ${n.step} · ${n.sourceType}`;document.querySelector('#drawerTitle').textContent=n.title;document.querySelector('#drawerNote').textContent=n.note;const img=document.querySelector('#drawerImg');img.style.display=n.image?'block':'none';if(n.image)img.src=n.image;const p=document.querySelector('#drawerPrompt');p.textContent=n.prompt||'这是结果节点，没有独立提示词；请沿上游路径查看生成依据。';p.classList.toggle('empty',!n.prompt);drawer.classList.add('open');renderNodes()}
    function close(){drawer.classList.remove('open');selected=null;renderNodes()} document.querySelector('#closeBtn').onclick=close;document.querySelector('#closeDetail').onclick=close;window.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
    function upstream(id){const list=[],seen=new Set();function visit(x){if(seen.has(x))return;const incoming=data.edges.filter(e=>e.target===x);incoming.forEach(e=>visit(e.source));seen.add(x);list.push(data.nodes.find(n=>n.id===x))}visit(id);return list}
    function pathText(id){return upstream(id).map(n=>`步骤 ${n.step}｜${n.title}\n${n.prompt||n.note}`).join('\n\n→\n\n')}
    async function copy(text,msg){try{await navigator.clipboard.writeText(text)}catch{const t=document.createElement('textarea');t.value=text;document.body.append(t);t.select();document.execCommand('copy');t.remove()}toast.textContent=msg;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1600)}
    document.querySelector('#copyNode').onclick=()=>{const n=data.nodes.find(x=>x.id===selected);copy(n.prompt||n.note,'本节点内容已复制')};document.querySelector('#copyPath').onclick=()=>copy(pathText(selected),'到此节点的路径已复制');document.querySelector('#copyPathTop').onclick=()=>copy(pathText(data.nodes.at(-1).id),'完整工作流路径已复制');
    document.querySelector('#localFile').onchange=e=>{const f=e.target.files[0];if(!f||!selected)return;const n=data.nodes.find(x=>x.id===selected),url=URL.createObjectURL(f);n.image=url;openNode(selected);toast.textContent='仅在本次预览中替换，未上传或保存';toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2200)};
    function fit(){const w=canvas.clientWidth,h=canvas.clientHeight;scale=Math.min(.9,(w-80)/1700,(h-80)/660);pan={x:Math.max(20,(w-1780*scale)/2),y:Math.max(20,(h-720*scale)/2)};applyTransform()} document.querySelector('#fitBtn').onclick=fit;document.querySelector('#resetBtn').onclick=()=>{data.nodes.forEach(n=>positions[n.id]={...n.position});renderNodes();fit()};
    renderNodes();fit();
  })();
  </script>
</body>
</html>
